services:
  - type: web
    name: portfolio-api
    runtime: node
    buildCommand: npm ci && npm run build:server && npm run index
    startCommand: node dist-server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
